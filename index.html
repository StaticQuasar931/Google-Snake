<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Snake Classroom</title>
  <meta name="description" content="Actual Google Snake presented inside a Google Classroom style shell with fullscreen and theme backgrounds.">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body data-scene="classroom-day">
  <div class="classroom-shell">
    <aside class="classroom-sidebar">
      <div class="sidebar-logo">Classroom</div>
      <div class="sidebar-dot active"></div>
      <div class="sidebar-dot"></div>
      <div class="sidebar-dot"></div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-avatar">S</div>
    </aside>

    <main class="workspace">
      <header class="workspace-topbar">
        <div>
          <p class="workspace-kicker">Google Classroom Theme</p>
          <h1>Google Snake</h1>
        </div>
        <div class="toolbar-actions">
          <button id="sceneClassroomButton" class="toolbar-button is-active" type="button">Classroom</button>
          <button id="sceneNightButton" class="toolbar-button" type="button">Night Study</button>
          <button id="sceneNotesButton" class="toolbar-button" type="button">Notes Desk</button>
        </div>
      </header>

      <section class="classroom-board">
        <div class="board-background">
          <div class="board-card announce-card">
            <div>
              <p class="card-label">Course Stream</p>
              <h2>Arcade Break</h2>
            </div>
            <p>Actual Google Snake loaded in the middle panel.</p>
          </div>

          <div class="board-card side-card">
            <p class="card-label">Quick Actions</p>
            <button id="fullscreenButton" class="chip-button" type="button">Fullscreen</button>
            <button id="maximizeButton" class="chip-button" type="button">Make Bigger</button>
            <button id="minimizeButton" class="chip-button" type="button">Make Smaller</button>
            <button id="reloadButton" class="chip-button" type="button">Reload Game</button>
          </div>
        </div>

        <div id="gameWindow" class="game-window size-normal">
          <div class="window-header">
            <div class="window-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="window-title">Google Snake</div>
            <div class="window-controls">
              <button id="overlayMinButton" class="window-button" type="button" aria-label="Minimize">-</button>
              <button id="overlayGrowButton" class="window-button" type="button" aria-label="Grow">+</button>
            </div>
          </div>
          <div class="game-frame-wrap">
            <iframe
              id="gameFrame"
              class="game-frame"
              src="./live-snake.html"
              title="Actual Google Snake"
              loading="eager"
              referrerpolicy="no-referrer">
            </iframe>
            <div id="frameStatus" class="frame-status">Loading actual Google Snake...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
